name: Bug report
description: An extracted field or a validation warning is wrong for a sample invoice
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Compare the PDF with the extracted fields in the service, then describe what is wrong.
        A maintainer adds the label `claude-autofix` to let Claude reproduce and fix it.
  - type: dropdown
    id: sample
    attributes:
      label: Sample invoice
      options:
        - acme-usd
        - bharat-inr
        - muller-eur
        - nova-gbp
        - orbit-discount
        - pioneer-qty
        - zenith-inr
        - other / not sure
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Field or warning that is wrong
      placeholder: e.g. Invoice date, Total, "Subtotal and tax give ..." warning
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the service shows
      placeholder: e.g. Invoice date 2026-03-04
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should show, and why
      placeholder: e.g. 2026-04-03 - the invoice is Indian and prints dates as day/month/year (03/04/2026)
    validations:
      required: true
